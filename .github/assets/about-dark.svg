<svg xmlns="http://www.w3.org/2000/svg" width="620" height="371" viewBox="0 0 620 371" role="img" aria-label="Sobre">
  <defs>
    <linearGradient id="pnl" x1="0" y1="0" x2="0" y2="371" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#0A0F16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#BFE9F7" stop-opacity="0.6"/>
      <stop offset="65%"  stop-color="#243140" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#243140" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="619" height="370" rx="9" fill="url(#pnl)" stroke="#243140"/>
  <rect x="0.5" y="0.5" width="619" height="2" rx="1" fill="url(#edge)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="26" y="40"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">Front-end e arquitetura na Corcovado Geosub. Entrego dados</tspan></text>
    <text x="26" y="67"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">AIS para a Petrobras no formato exato que o contrato exige</tspan></text>
    <text x="26" y="94"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">— e desenhei o banco, o TLS e o proxy por trás da entrega.</tspan></text>
    <text x="26" y="121"><tspan fill="#BFE9F7">&gt;</tspan></text>
    <text x="26" y="148"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">Me importo com o que acontece quando falha: data malformada</tspan></text>
    <text x="26" y="175"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">devolve 400, não a série inteira. Vento indisponível aparece</tspan></text>
    <text x="26" y="202"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">como indisponível, nunca como número estimado.</tspan></text>
    <text x="26" y="229"><tspan fill="#BFE9F7">&gt;</tspan></text>
    <text x="26" y="256"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">Fora disso: motores de jogo em Canvas 2D, timestep fixo e</tspan></text>
    <text x="26" y="283"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#9FB6C9">frame data de verdade.</tspan></text>
    <text x="26" y="310"><tspan fill="#BFE9F7">&gt;</tspan></text>
    <text x="26" y="337"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#E8EEF7">Winterfell remembers.</tspan></text>
  </g>

  <rect x="208" y="325" width="9" height="17" fill="#BFE9F7">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
</svg>
