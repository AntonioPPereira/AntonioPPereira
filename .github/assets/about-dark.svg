<svg xmlns="http://www.w3.org/2000/svg" width="636" height="252" viewBox="0 0 636 252" role="img" aria-label="Ficha tecnica">
  <defs>
    <linearGradient id="pnl" x1="0" y1="0" x2="0" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#0A0F16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="636" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#BFE9F7" stop-opacity="0.65"/>
      <stop offset="60%"  stop-color="#243140" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#243140" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#BFE9F7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#BFE9F7" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#BFE9F7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner">
      <rect x="1" y="1" width="634" height="250" rx="9"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="635" height="251" rx="9" fill="url(#pnl)" stroke="#243140"/>
  <rect x="0.5" y="0.5" width="635" height="2" rx="1" fill="url(#edge)"/>

  <g clip-path="url(#inner)">
    <rect x="0" y="-46" width="636" height="46" fill="url(#scan)">
      <animate attributeName="y" from="-46" to="252" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="26" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3.4"
        fill="#BFE9F7" opacity="0.85">FICHA</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="26" y="49" width="3" height="10" fill="#BFE9F7" opacity="0.5"/>
    <text x="39" y="58" font-size="11" letter-spacing="1.6" fill="#5E788C">CASA</text>
    <text x="178" y="58" font-size="15" fill="#D6E4EF">Corcovado Geosub</text>
    <rect x="26" y="81" width="3" height="10" fill="#BFE9F7" opacity="0.5"/>
    <text x="39" y="90" font-size="11" letter-spacing="1.6" fill="#5E788C">FUNÇÃO</text>
    <text x="178" y="90" font-size="15" fill="#D6E4EF">Direção de front-end e arquitetura</text>
    <rect x="26" y="113" width="3" height="10" fill="#BFE9F7" opacity="0.5"/>
    <text x="39" y="122" font-size="11" letter-spacing="1.6" fill="#5E788C">CLIENTE</text>
    <text x="178" y="122" font-size="15" fill="#D6E4EF">Petrobras</text>
    <rect x="26" y="145" width="3" height="10" fill="#BFE9F7" opacity="0.5"/>
    <text x="39" y="154" font-size="11" letter-spacing="1.6" fill="#5E788C">ENTREGA</text>
    <text x="178" y="154" font-size="15" fill="#D6E4EF">XML · Apêndice D · HTTPS</text>
    <rect x="26" y="177" width="3" height="10" fill="#BFE9F7" opacity="0.5"/>
    <text x="39" y="186" font-size="11" letter-spacing="1.6" fill="#5E788C">SISTEMAS</text>
    <text x="178" y="186" font-size="15" fill="#D6E4EF">AIS Web · Suprimentos · Treinamentos</text>
    <rect x="26" y="209" width="3" height="10" fill="#BFE9F7" opacity="0.5"/>
    <text x="39" y="218" font-size="11" letter-spacing="1.6" fill="#5E788C">PARALELO</text>
    <text x="178" y="218" font-size="15" fill="#D6E4EF">LENDAS Network · Artreus · 2 motores de jogo</text>
  </g>


</svg>
