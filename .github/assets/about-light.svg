<svg xmlns="http://www.w3.org/2000/svg" width="640" height="312" viewBox="0 0 640 312" role="img" aria-label="Ficha tecnica">
  <defs>
    <linearGradient id="pnl" x1="0" y1="0" x2="0" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F8FB"/>
      <stop offset="100%" stop-color="#E9F0F6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3D7C93" stop-opacity="0.65"/>
      <stop offset="60%"  stop-color="#C9D8E4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C9D8E4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3D7C93" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#3D7C93" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#3D7C93" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner">
      <rect x="1" y="1" width="638" height="310" rx="9"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="311" rx="9" fill="url(#pnl)" stroke="#C9D8E4"/>
  <rect x="0.5" y="0.5" width="639" height="2" rx="1" fill="url(#edge)"/>

  <g clip-path="url(#inner)">
    <rect x="0" y="-46" width="640" height="46" fill="url(#scan)">
      <animate attributeName="y" from="-46" to="312" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="26" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3.4"
        fill="#3D7C93" opacity="0.85">FICHA</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="26" y="47" width="3" height="10" fill="#3D7C93" opacity="0.5"/>
    <text x="39" y="56" font-size="10.5" letter-spacing="1.5" fill="#7E97AB">CASA</text>
    <text x="200" y="56" font-size="13.5" fill="#1B2A36">Corcovado Geosub</text>
    <rect x="26" y="77" width="3" height="10" fill="#3D7C93" opacity="0.5"/>
    <text x="39" y="86" font-size="10.5" letter-spacing="1.5" fill="#7E97AB">FUNÇÃO</text>
    <text x="200" y="86" font-size="13.5" fill="#1B2A36">Direção de front-end e arquitetura</text>
    <rect x="26" y="107" width="3" height="10" fill="#3D7C93" opacity="0.5"/>
    <text x="39" y="116" font-size="10.5" letter-spacing="1.5" fill="#7E97AB">CLIENTE</text>
    <text x="200" y="116" font-size="13.5" fill="#1B2A36">Petrobras</text>
    <rect x="26" y="137" width="3" height="10" fill="#3D7C93" opacity="0.5"/>
    <text x="39" y="146" font-size="10.5" letter-spacing="1.5" fill="#7E97AB">ENTREGA</text>
    <text x="200" y="146" font-size="13.5" fill="#1B2A36">XML · Apêndice D · HTTPS</text>
    <rect x="26" y="167" width="3" height="10" fill="#3D7C93" opacity="0.5"/>
    <text x="39" y="176" font-size="10.5" letter-spacing="1.5" fill="#7E97AB">SISTEMAS</text>
    <text x="200" y="176" font-size="13.5" fill="#1B2A36">AIS Web · Suprimentos · Treinamentos</text>
    <rect x="26" y="197" width="3" height="10" fill="#3D7C93" opacity="0.5"/>
    <text x="39" y="206" font-size="10.5" letter-spacing="1.5" fill="#7E97AB">STACK</text>
    <text x="200" y="206" font-size="13.5" fill="#1B2A36">React · Flask · Postgres · Docker · Traefik</text>
    <rect x="26" y="227" width="3" height="10" fill="#3D7C93" opacity="0.5"/>
    <text x="39" y="236" font-size="10.5" letter-spacing="1.5" fill="#7E97AB">ALÉM DA MURALHA</text>
    <text x="200" y="236" font-size="13.5" fill="#1B2A36">Dois motores de jogo em Canvas 2D</text>
  </g>

  <rect x="26" y="258" width="588" height="1" fill="#C9D8E4"/>

  <text x="26" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5"
        fill="#41586B" font-style="italic">Falha aparece como falha — nunca como número estimado.</text>
</svg>
