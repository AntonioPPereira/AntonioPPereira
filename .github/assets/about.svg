<svg xmlns="http://www.w3.org/2000/svg" width="700" height="222" viewBox="0 0 700 222" role="img" aria-label="About me">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#0A0F16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#BFE9F7" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#4A6072" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4A6072" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="699" height="221" rx="8" fill="url(#panel)" stroke="#243140"/>
  <rect x="0.5" y="0.5" width="699" height="2" rx="1" fill="url(#edge)"/>

  <rect x="1" y="3" width="52" height="216" fill="#0B111A"/>
  <line x1="53" y1="3" x2="53" y2="219" stroke="#1E2936"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <g fill="#3D5265" text-anchor="end">
      <text x="40" y="42">01</text>
      <text x="40" y="68">02</text>
      <text x="40" y="94">03</text>
      <text x="40" y="120">04</text>
      <text x="40" y="146">05</text>
      <text x="40" y="172">06</text>
      <text x="40" y="198">07</text>
    </g>

    <g fill="#8FA9BF">
      <text x="70" y="42"><tspan fill="#BFE9F7">&gt;</tspan> Front-end Developer focused on crafting immersive</text>
      <text x="70" y="68"><tspan fill="#BFE9F7">&gt;</tspan> and performant user experiences. Passionate about</text>
      <text x="70" y="94"><tspan fill="#BFE9F7">&gt;</tspan> clean code, design systems, animations and building</text>
      <text x="70" y="120"><tspan fill="#BFE9F7">&gt;</tspan> digital experiences that make an impact.</text>
      <text x="70" y="146"><tspan fill="#BFE9F7">&gt;</tspan></text>
      <text x="70" y="172"><tspan fill="#BFE9F7">&gt;</tspan> Always learning. Always building.</text>
      <text x="70" y="198"><tspan fill="#BFE9F7">&gt;</tspan> <tspan fill="#E8EEF7">Winterfell remembers.</tspan></text>
    </g>
  </g>

  <rect x="240" y="187" width="8" height="15" fill="#BFE9F7">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
</svg>
